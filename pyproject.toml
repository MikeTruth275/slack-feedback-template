[project]
name = "slack-feedback-template"
version = "0.1.0"
description = "Reusable Slack app template for product feedback capture and triage"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.39.0,<2.0.0",
    "pulumi>=3.100.0,<4.0.0",
    "pulumi-aws>=6.0.0,<8.0.0",
    "pulumi-random>=4.18.0,<5.0.0",
    "pyyaml>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.1.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
