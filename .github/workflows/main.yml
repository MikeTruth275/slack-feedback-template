name: Pulumi Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: ${{ vars.PULUMI_STACK_NAME != '' && vars.AWS_ROLE_TO_ASSUME != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Pulumi Up
        uses: ./.github/actions/pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        with:
          command: up
          stack-name: ${{ vars.PULUMI_STACK_NAME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          infisical-external-id: ${{ secrets.INFISICAL_EXTERNAL_ID }}
